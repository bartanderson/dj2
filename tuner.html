<!DOCTYPE html>
<html>
<head>
    <title>Terrain Map Tuner</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; }
        canvas { border: 1px solid #888; margin: 20px; }
        .controls { margin: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        .control-group { background: #222; padding: 8px; border-radius: 5px; }
        label { display: inline-block; width: 120px; }
        input { width: 80px; }
        button { margin: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/seedrandom.min.js"></script>
</head>
<body>
    <div class="controls">
        <div class="control-group">
            <label>Ocean Height:</label>
            <input type="number" id="oceanHeight" step="0.01" value="0.2">
        </div>
        <div class="control-group">
            <label>Coast Height:</label>
            <input type="number" id="coastHeight" step="0.01" value="0.45">
        </div>
        <div class="control-group">
            <label>Lake Height:</label>
            <input type="number" id="lakeHeight" step="0.01" value="0.35">
        </div>
        <div class="control-group">
            <label>River Multiplier:</label>
            <input type="number" id="riverMultiplier" step="0.5" value="10.0">
        </div>
        <div class="control-group">
            <label>Seed:</label>
            <input type="text" id="seed" value="42">
        </div>
        <button id="generate">Generate</button>
        <button id="randomSeed">Random Seed</button>
    </div>
    <canvas id="mapCanvas" width="400" height="300"></canvas>
    <div id="info"></div>

<script>
// ============================================================================
// PerlinNoise (same as before)
// ============================================================================
class PerlinNoise {
    constructor(seed) {
        this.p = new Array(512);
        const perm = this.generatePermutation(seed);
        for (let i = 0; i < 512; i++) {
            this.p[i] = perm[i % 256];
        }
    }
    generatePermutation(seed) {
        const rng = new Math.seedrandom(seed.toString());
        const p = new Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i >= 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [p[i], p[j]] = [p[j], p[i]];
        }
        return p;
    }
    noise(x, y, z) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const Z = Math.floor(z) & 255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        z -= Math.floor(z);
        const u = this.fade(x);
        const v = this.fade(y);
        const w = this.fade(z);
        const A = (this.p[X] + Y) & 255;
        const AA = (this.p[A] + Z) & 255;
        const AB = (this.p[A + 1] + Z) & 255;
        const B = (this.p[X + 1] + Y) & 255;
        const BA = (this.p[B] + Z) & 255;
        const BB = (this.p[B + 1] + Z) & 255;
        return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z)), this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))), this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1)), this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
    }
    fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    lerp(t, a, b) { return a + t * (b - a); }
    grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
    }
}

// ============================================================================
// TerrainGenerator (basic)
// ============================================================================
class TerrainGenerator {
    constructor(seed, width, height) {
        this.seed = seed;
        this.width = width;
        this.height = height;
        this.perlinNoise = new PerlinNoise(seed);
    }
    generateHeightmap() {
        const width = this.width;
        const height = this.height;
        const scale = 0.005;
        const octaves = 4;
        const persistence = 0.5;
        const lacunarity = 2;
        let maxNoise = 0;
        let amp = 1;
        for (let i = 0; i < octaves; i++) {
            maxNoise += amp;
            amp *= persistence;
        }
        const heightmap = Array(height).fill().map(() => Array(width).fill(0));
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let noise = 0;
                let a = 1;
                let f = 1;
                for (let i = 0; i < octaves; i++) {
                    noise += this.perlinNoise.noise(x * scale * f, y * scale * f, this.seed) * a;
                    a *= persistence;
                    f *= lacunarity;
                }
                heightmap[y][x] = (noise + maxNoise) / (2 * maxNoise);
            }
        }
        return heightmap;
    }
}

// ============================================================================
// Custom terrain image generation with adjustable thresholds
// ============================================================================
function generateTerrainImageCustom(worldMap, oceanHeight, coastHeight, lakeHeight, riverMultiplier) {
    const width = worldMap.width;
    const height = worldMap.height;
    const area = width * height;
    const seed = worldMap.seed || 42;

    const terrainGen = new TerrainGenerator(seed, width, height);
    const heightmap = terrainGen.generateHeightmap();

    // Moisture map
    const moistureGen = new TerrainGenerator(seed + 1000, width, height);
    const moistureMap = moistureGen.generateHeightmap();

    const thresholds = {
        low: 0.3,
        plains: 0.54,
        forest: 0.65,
        hills: 0.73,
        mountains: 0.85,
    };
    const forestMinMoisture = 0.6;
    const forestColor = '#2c5e2e';
    const riverColor = '#4a90e2';
    const lakeColor = '#3a80c2';

    // Create base canvas
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');

    // Base terrain (height-based)
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const h = heightmap[y][x];
            let color;
            if (h < oceanHeight) color = '#4d6fb8';      // ocean
            else if (h < coastHeight) color = '#a2c4c9'; // coast
            else if (h < 0.58) color = '#689f38';       // plains
            else if (h < 0.65) color = '#8d9946';       // hills
            else if (h < 0.73) color = '#8d99ae';       // mountains
            else color = '#ffffff';                      // snowcaps
            tempCtx.fillStyle = color;
            tempCtx.fillRect(x, y, 1, 1);
        }
    }

    // River generation
    const targetRiverCount = Math.floor(area / 8000 * riverMultiplier);
    let riverMask = Array(height).fill().map(() => Array(width).fill(false));
    const rngRiver = new Math.seedrandom(seed + 10000);

    let startCandidates = [];
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const h = heightmap[y][x];
            if (h >= thresholds.hills && h <= thresholds.mountains) {
                let isLocalMax = true;
                for (let dy = -1; dy <= 1 && isLocalMax; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            if (heightmap[ny][nx] > h) {
                                isLocalMax = false;
                                break;
                            }
                        }
                    }
                }
                if (isLocalMax) startCandidates.push([x, y]);
            }
        }
    }
    if (startCandidates.length === 0) {
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                if (heightmap[y][x] >= thresholds.hills && heightmap[y][x] <= thresholds.mountains) {
                    startCandidates.push([x, y]);
                }
            }
        }
    }
    for (let i = startCandidates.length - 1; i > 0; i--) {
        const j = Math.floor(rngRiver() * (i + 1));
        [startCandidates[i], startCandidates[j]] = [startCandidates[j], startCandidates[i]];
    }

    for (let r = 0; r < Math.min(targetRiverCount, startCandidates.length); r++) {
        let [x, y] = startCandidates[r];
        const visited = new Set();
        const path = [];
        let steps = 0;
        while (true) {
            if (y < 0 || y >= height || x < 0 || x >= width) break;
            const key = `${x},${y}`;
            if (visited.has(key)) break;
            visited.add(key);
            path.push([x, y]);
            const h = heightmap[y][x];
            if (h < thresholds.low) break;
            const neighbors = [];
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height && !visited.has(`${nx},${ny}`)) {
                        const nh = heightmap[ny][nx];
                        if (nh < h) {
                            neighbors.push({ x: nx, y: ny, height: nh });
                        }
                    }
                }
            }
            if (neighbors.length === 0) break;
            let totalWeight = 0;
            const weights = neighbors.map(n => (h - n.height) + 0.1);
            weights.forEach(w => totalWeight += w);
            let rand = rngRiver() * totalWeight;
            let chosen = null;
            for (let i = 0; i < neighbors.length; i++) {
                if (rand < weights[i]) {
                    chosen = neighbors[i];
                    break;
                }
                rand -= weights[i];
            }
            if (!chosen) chosen = neighbors[0];
            [x, y] = [chosen.x, chosen.y];
            steps++;
            if (steps > 300) break;
        }
        for (let [px, py] of path) {
            riverMask[py][px] = true;
        }
    }

    // Paint forest (over plains/hills)
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const h = heightmap[y][x];
            const m = moistureMap[y][x];
            if (h >= thresholds.plains && h <= thresholds.forest && m > forestMinMoisture && !riverMask[y][x]) {
                tempCtx.fillStyle = forestColor;
                tempCtx.fillRect(x, y, 1, 1);
            }
        }
    }

    // Paint lakes (low-lying areas, but not ocean)
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const h = heightmap[y][x];
            if (h < lakeHeight && h >= oceanHeight) { // only on land
                tempCtx.fillStyle = lakeColor;
                tempCtx.fillRect(x, y, 1, 1);
            }
        }
    }

    // Draw rivers (overrides)
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            if (riverMask[y][x]) {
                const h = heightmap[y][x];
                if (h < 0.73) { // not snowcaps
                    tempCtx.fillStyle = riverColor;
                    tempCtx.fillRect(x, y, 1, 1);
                }
            }
        }
    }

    // Final image
    const offscreen = document.createElement('canvas');
    offscreen.width = width;
    offscreen.height = height;
    const offCtx = offscreen.getContext('2d');
    offCtx.drawImage(tempCanvas, 0, 0);
    return offscreen;
}

function generateMap() {
    const seed = parseInt(document.getElementById('seed').value);
    const oceanHeight = parseFloat(document.getElementById('oceanHeight').value);
    const coastHeight = parseFloat(document.getElementById('coastHeight').value);
    const lakeHeight = parseFloat(document.getElementById('lakeHeight').value);
    const riverMultiplier = parseFloat(document.getElementById('riverMultiplier').value);

    const width = 1000;
    const height = 800;
    const worldMap = { width, height, seed, hexes: [] };
    const terrainCanvas = generateTerrainImageCustom(worldMap, oceanHeight, coastHeight, lakeHeight, riverMultiplier);
    const displayCanvas = document.getElementById('mapCanvas');
    displayCanvas.width = width;
    displayCanvas.height = height;
    const ctx = displayCanvas.getContext('2d');
    ctx.drawImage(terrainCanvas, 0, 0);
    document.getElementById('info').innerHTML = `Seed: ${seed} | Ocean: ${oceanHeight} | Coast: ${coastHeight} | Lake: ${lakeHeight} | River x${riverMultiplier}`;
}

document.getElementById('generate').addEventListener('click', generateMap);
document.getElementById('randomSeed').addEventListener('click', () => {
    const seed = Math.floor(Math.random() * 1000000);
    document.getElementById('seed').value = seed;
    generateMap();
});
generateMap();
</script>
</body>
</html>
