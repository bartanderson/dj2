name: coverage_analyzer
description: Analyzes test coverage of source files

provides:
  - action: analyze.coverage
    description: Compare source files against test files
    inputs:
      - name: sources
        type: list
      - name: tests
        type: list
    outputs:
      - name: coverage_report
        type: object
        properties:
          total_files: integer
          covered_files: integer
          uncovered_files: list
          coverage_percent: number