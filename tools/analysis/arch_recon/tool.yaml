name: arch_recon
description: Architecture reconnaissance - scan, analyze, generate context, consult AI, create tests
path: tools/analysis/arch_recon.py
execution: cli

provides:
  - action: arch.scan_project
    description: Full project scan to populate database
    flags: ["--scout"]
    outputs: ["db_populated"]
  
  - action: arch.find_hot_files
    description: List most frequently changed files
    flags: ["--hot"]
    parameters:
      limit: "integer"
    outputs: ["hot_files_report"]
  
  - action: arch.risk_analysis
    description: Generate risk heatmap of files
    flags: ["--risk-heatmap"]
    parameters:
      min_priority: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
    outputs: ["risk_report"]
  
  - action: arch.generate_context
    description: Build AI-ready context package
    flags: ["--context"]
    parameters:
      intent: "string"
      context_level: ["brief", "standard", "deep"]
    outputs: ["context_package"]
  
  - action: arch.consult_ai
    description: Generate context and consult AI
    flags: ["--consult"]
    parameters:
      intent: "string"
      target: ["auto", "ollama", "deepseek"]
    outputs: ["ai_response", "session_saved"]
  
  - action: arch.generate_test
    description: Generate pytest file for intent
    flags: ["--test"]
    parameters:
      intent: "string"
      output: "filepath"
    outputs: ["test_file"]
  
  - action: arch.learn_from_test
    description: Extract test patterns from existing test
    flags: ["--extract-patterns"]
    parameters:
      test_file: "filepath"
    outputs: ["patterns_stored"]