name: data_store
description: Store arbitrary data in a session file and return the file path
execution: cli
path: tools/data_store/store.py
provides:
  - action: data.store
    description: Write input data to a JSON file in the session folder
    parameters:
      data: any
      # Optional: a hint for the filename
      _step_name: string
    input_format: json
    output_format: json