name: file_display
description: Display contents of a file (text or JSON) in a readable format
execution: cli
path: tools/file_display/run.py

provides:
  - action: file.display
    description: Print file contents to stdout
    parameters:
      path: "string (required) - path to file"
      format: "string (optional, default: text) - json or text"
    input_format: json