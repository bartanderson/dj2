<!DOCTYPE html>
<html>
<head>
    <title>Dungeon Explorer</title>
    <link rel="icon" href="image/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="data:,"> <!-- gets rid of favicon 404 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/dungeon.js') }}"></script>
    <style>
        :root {
            --sidebar-width: 300px;
            --chat-height: 200px;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Map area */
        .map-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            overflow: hidden;
        }
        
        .controls {
            padding: 15px;
            background: #16213e;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .direction-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            flex: 1;
        }
        .debug-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 15px;
            background: #16213e;
        }

        /* Diagonal direction buttons */
        button[id$='east'], button[id$='west'] {
            font-size: 14px; /* Slightly smaller for diagonal labels */
        }
                
        button {
            padding: 12px;
            background: #0f3460;
            color: #e6e6e6;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 16px;
        }
        
        button:hover {
            background: #133b74;
        }
        
        #dungeon-map {
            flex: 1;
            object-fit: contain;
            max-height: calc(100vh - 200px);
        }
        
        /* Chat sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: #1b1b2f;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #0f3460;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            padding: 15px;
            background: #0f3460;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        
        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #1f1f3d;
        }
        
        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            background: #16213e;
            color: #e6e6e6;
            animation: fadeIn 0.3s;
        }
        
        .message.error {
            background: #4a1a1a; /* Dark red background */
            color: #ff9999;      /* Light red text */
            white-space: pre-wrap; /* Preserve newlines */
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .message.user {
            background: #0f3460;
            align-self: flex-end;
        }
        
        .message.ai {
            background: #1a3c5f;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chat-input {
            display: flex;
            padding: 15px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            flex-direction: column;
        }
        .chat-buttons {
            display: flex;
            padding: 15px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            flex-direction: row;
        }
        
        #chat-text {
            flex: 1;
            padding: 12px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1f1f3d;
            color: white;
            resize: none;
        }
        
        #send-chat {
            margin-left: 10px;
            padding: 0 20px;
            background: #4ecca3;
            color: #1a1a2e;
            font-weight: bold;
        }
        
        #send-chat:hover {
            background: #3dbb91;
        }
        
        .position-info {
            padding: 10px;
            background: #16213e;
            color: #e6e6e6;
            text-align: center;
            font-family: monospace;
        }
        
    </style>
</head>
<body>
    <!-- Dungeon UI -->
    <div id="dungeon-ui" class="dungeon-only">
        <div style="display: grid; grid-template-columns: minmax(400px, 3fr) minmax(300px, 1fr); height: 100vh; margin: 0; padding: 0; overflow: hidden; gap: 0;">
            <!-- LEFT COLUMN: Dungeon Map (resizes automatically) -->
            <div style="background: #0a0a1a; padding: 10px; display: flex; flex-direction: column; overflow: hidden; min-height: 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0;">
                    <h2 style="color: #4ecca3; margin: 0;">Dungeon Map</h2>
                </div>
                <div style="flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: stretch; overflow: hidden; border: 2px solid #4ecca3; border-radius: 4px; background: black;">
                    <img id="dungeon-map" src="http://localhost:5005/dungeon-image" 
                         style="width: 100%; height: 100%; object-fit: contain; display: block; min-width: 0; min-height: 0;">
                </div>
            </div>
            
            <!-- RIGHT COLUMN: Resizable AI Controls -->
            <div id="dungeon-chat-panel" 
                 style="background: linear-gradient(135deg, #1a1a2e, #16213e); 
                        padding: 10px; 
                        display: flex; 
                        flex-direction: column; 
                        overflow: hidden;
                        resize: horizontal;
                        min-width: 300px;
                        max-width: 600px;
                        border-left: 2px solid #4ecca3;">
                
                <h2 style="color: #4ecca3; margin-bottom: 15px; text-align: center;">AI Dungeon Master</h2>
                
                <!-- Debug controls and position -->
                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div>
                            <button onclick="toggleDebug()" style="padding: 6px 12px; margin-right: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">Toggle Debug</button>
                            <button onclick="resetDungeon()" style="padding: 6px 12px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">New Dungeon</button>
                        </div>
                        <span style="font-family: monospace; font-size: 13px; color: #cccccc;">
                            Position: <span id="dungeon-position">(?, ?)</span>
                        </span>
                    </div>
                    
                    <!-- Movement grid -->
                    <div style="margin-bottom: 10px;">
                        <div style="color: #cccccc; margin-bottom: 5px; font-size: 13px;">Movement Controls:</div>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;">
                            <button onclick="moveDungeon('northwest')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">↖ NW</button>
                            <button onclick="moveDungeon('north')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">↑ North</button>
                            <button onclick="moveDungeon('northeast')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">↗ NE</button>
                            <button onclick="moveDungeon('west')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">← West</button>
                            <button onclick="dungeonWait()" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Wait</button>
                            <button onclick="moveDungeon('east')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">→ East</button>
                            <button onclick="moveDungeon('southwest')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">↙ SW</button>
                            <button onclick="moveDungeon('south')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">↓ South</button>
                            <button onclick="moveDungeon('southeast')" style="padding: 8px; background: #0f3460; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">↘ SE</button>
                        </div>
                    </div>
                </div>
                
                <!-- Chat log -->
                <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 200px;">
                    <div style="color: #cccccc; margin-bottom: 5px; font-size: 14px;">Chat Log:</div>
                    <div id="dungeon-chat" style="flex: 1; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; font-size: 12px; line-height: 1.3; margin-bottom: 10px;">
                        <div style="color: #cccccc;">Use movement buttons or type commands.</div>
                    </div>
                    
                    <!-- AI Command input -->
                    <div>
                        <div style="color: #cccccc; margin-bottom: 5px; font-size: 13px;">Send AI Command:</div>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="dungeon-ai-command" placeholder="Type command..." 
                                   style="flex: 1; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid #4ecca3; color: white; border-radius: 4px; font-size: 13px;">
                            <button onclick="sendAICommand()" style="padding: 8px 15px; background: #4ecca3; color: #232931; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
