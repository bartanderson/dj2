<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detailed Terrain Test with Hex Overlay</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; }
        canvas { border: 1px solid #888; margin: 20px; background: #222; }
        .controls { margin: 20px; padding: 10px; background: #333; border-radius: 5px; display: inline-block; vertical-align: top; }
        label { display: inline-block; width: 100px; }
        input, button { margin: 5px; }
        .legend { margin: 20px; display: inline-block; vertical-align: top; }
        .legend div { margin: 5px; }
        .color-box { display: inline-block; width: 12px; height: 12px; margin-right: 5px; }
        .debug { margin: 20px; background: #222; padding: 10px; font-size: 12px; white-space: pre; font-family: monospace; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
</head>
<body>
    <div class="controls">
        <h3>Detailed Terrain Test (20x20 hex grid)</h3>
        <label>Seed:</label>
        <input type="number" id="seed" value="42" step="1"><br>
        <label>Ocean threshold:</label>
        <input type="number" id="ocean_thresh" value="0.45" step="0.01" min="0" max="1"><br>
        <label>Coast threshold:</label>
        <input type="number" id="coast_thresh" value="0.5" step="0.01" min="0" max="1"><br>
        <label>Plains threshold:</label>
        <input type="number" id="plains_thresh" value="0.58" step="0.01" min="0" max="1"><br>
        <label>Hills threshold:</label>
        <input type="number" id="hills_thresh" value="0.65" step="0.01" min="0" max="1"><br>
        <label>Mountains threshold:</label>
        <input type="number" id="mountains_thresh" value="0.73" step="0.01" min="0" max="1"><br>
        <label>Rivers:</label>
        <input type="number" id="river_count" value="10" min="0" max="30" step="1"><br>
        <button id="regenerate">Regenerate</button>
    </div>
    <div class="legend">
        <div><span class="color-box" style="background:#4d6fb8;"></span> Ocean</div>
        <div><span class="color-box" style="background:#a2c4c9;"></span> Coast</div>
        <div><span class="color-box" style="background:#689f38;"></span> Plains</div>
        <div><span class="color-box" style="background:#8d9946;"></span> Hills</div>
        <div><span class="color-box" style="background:#8d99ae;"></span> Mountains</div>
        <div><span class="color-box" style="background:#ffffff;"></span> Snowcaps</div>
    </div>
    <canvas id="test-canvas" width="1000" height="800"></canvas>
    <div id="debug-info" class="debug"></div>

<script>
    // ----- Perlin Noise (identical to terrain-generator.js) -----
    class PerlinNoise {
        constructor(seed) {
            this.p = new Array(512);
            const perm = this.generatePermutation(seed);
            for (let i = 0; i < 512; i++) {
                this.p[i] = perm[i % 256];
            }
        }
        generatePermutation(seed) {
            const rng = new Math.seedrandom(seed.toString());
            const p = new Array(256);
            for (let i = 0; i < 256; i++) {
                p[i] = i;
            }
            for (let i = 255; i >= 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                const temp = p[i];
                p[i] = p[j];
                p[j] = temp;
            }
            return p;
        }
        fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        lerp(t, a, b) { return a + t * (b - a); }
        grad(hash, x, y, z) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }
        noise(x, y, z = 0) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            const Z = Math.floor(z) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            z -= Math.floor(z);
            const u = this.fade(x);
            const v = this.fade(y);
            const w = this.fade(z);

            const A = (this.p[X] + Y) & 255;
            const AA = (this.p[A] + Z) & 255;
            const AB = (this.p[A + 1] + Z) & 255;
            const B = (this.p[X + 1] + Y) & 255;
            const BA = (this.p[B] + Z) & 255;
            const BB = (this.p[B + 1] + Z) & 255;

            const x1 = this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z));
            const x2 = this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z));
            const y1 = this.lerp(v, x1, x2);

            const x3 = this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1));
            const x4 = this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1));
            const y2 = this.lerp(v, x3, x4);

            return this.lerp(w, y1, y2);
        }
    }

    // ----- TerrainGenerator (full image generation) -----
    class TerrainGenerator {
        constructor(seed, width, height) {
            this.seed = seed;
            this.width = width;
            this.height = height;
            this.perlin = new PerlinNoise(this.seed);
            this.terrainTypes = {
                "ocean": {"color": "#4d6fb8", "height_range": [-1, 0.45]},
                "coast": {"color": "#a2c4c9", "height_range": [0.45, 0.5]},
                "plains": {"color": "#689f38", "height_range": [0.5, 0.58]},
                "hills": {"color": "#8d9946", "height_range": [0.58, 0.65]},
                "mountains": {"color": "#8d99ae", "height_range": [0.65, 0.73]},
                "snowcaps": {"color": "#ffffff", "height_range": [0.73, 1]}
            };
        }
        generateHeightmap() {
            const heightmap = new Array(this.height).fill(null).map(() => new Array(this.width).fill(0));
            const scale = 0.005;
            const octaves = 4;
            const persistence = 0.5;
            const lacunarity = 2;
            let maxNoise = 0;
            let amplitude = 1;
            for (let i = 0; i < octaves; i++) {
                maxNoise += amplitude;
                amplitude *= persistence;
            }
            for (let y = 0; y < this.height; y++) {
                for (let x = 0; x < this.width; x++) {
                    let noise = 0;
                    amplitude = 1;
                    let frequency = 1;
                    for (let i = 0; i < octaves; i++) {
                        noise += this.perlin.noise(x * scale * frequency, y * scale * frequency) * amplitude;
                        amplitude *= persistence;
                        frequency *= lacunarity;
                    }
                    heightmap[y][x] = (noise + maxNoise) / (2 * maxNoise);
                }
            }
            return heightmap;
        }
        generateTerrain(heightmap) {
            const terrain = new Array(this.height).fill(null).map(() => new Array(this.width).fill(0));
            for (let y = 0; y < this.height; y++) {
                for (let x = 0; x < this.width; x++) {
                    const height = heightmap[y][x];
                    let terrainType = "ocean";
                    if (height >= this.terrainTypes["snowcaps"].height_range[0]) {
                        terrainType = "snowcaps";
                    } else if (height >= this.terrainTypes["mountains"].height_range[0]) {
                        terrainType = "mountains";
                    } else if (height >= this.terrainTypes["hills"].height_range[0]) {
                        terrainType = "hills";
                    } else if (height >= this.terrainTypes["plains"].height_range[0]) {
                        terrainType = "plains";
                    } else if (height >= this.terrainTypes["coast"].height_range[0]) {
                        terrainType = "coast";
                    }
                    terrain[y][x] = this.terrainTypes[terrainType].color;
                }
            }
            return terrain;
        }
        renderTerrain(terrain, canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            const scaleX = this.width / canvas.width;
            const scaleY = this.height / canvas.height;
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const originalX = Math.floor(x * scaleX);
                    const originalY = Math.floor(y * scaleY);
                    const hexColor = terrain[originalY][originalX];
                    const r = parseInt(hexColor.substring(1,3), 16);
                    const g = parseInt(hexColor.substring(3,5), 16);
                    const b = parseInt(hexColor.substring(5,7), 16);
                    const idx = (y * canvas.width + x) * 4;
                    data[idx] = r;
                    data[idx+1] = g;
                    data[idx+2] = b;
                    data[idx+3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }
    }

    function generateRivers(heightmap, thresholds, numRivers = 5, seed) {
        const rows = heightmap.length;
        const cols = heightmap[0].length;
        const riverMask = Array(rows).fill().map(() => Array(cols).fill(false));
        const rng = new Math.seedrandom(seed);

        let startCandidates = [];
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const h = heightmap[y][x];
                if (h >= thresholds.plains) { // or thresholds.hills? Use plains for more rivers
                    startCandidates.push([x, y]);
                }
            }
        }
        console.log("DEBUG: startCandidates length", startCandidates.length);
        if (startCandidates.length === 0) return riverMask;

        // Shuffle candidates
        for (let i = startCandidates.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [startCandidates[i], startCandidates[j]] = [startCandidates[j], startCandidates[i]];
        }

        for (let r = 0; r < numRivers && r < startCandidates.length; r++) {
            let [x, y] = startCandidates[r];
            const visited = new Set();
            let path = [];
            while (true) {
                if (y < 0 || y >= rows || x < 0 || x >= cols) break;
                const key = `${x},${y}`;
                if (visited.has(key)) break;
                visited.add(key);
                path.push([x, y]);

                const h = heightmap[y][x];
                if (h < thresholds.ocean) break; // ocean

                let best = null;
                let bestH = h;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = x + dx;
                        const ny = y + dy;
                        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                            const nh = heightmap[ny][nx];
                            if (nh < bestH) {
                                bestH = nh;
                                best = [nx, ny];
                            }
                        }
                    }
                }
                if (!best) break;
                [x, y] = best;
                if (path.length > 200) break;
            }
            for (let [px, py] of path) {
                if (py >= 0 && py < rows && px >= 0 && px < cols) {
                    riverMask[py][px] = true;
                }
            }
        }
        console.log("DEBUG: rivers generated, count", riverMask.flat().filter(v => v).length);
        return riverMask;
    }
    function dilateMask(mask, radius=1) {
        const rows = mask.length;
        const cols = mask[0].length;
        const dilated = Array(rows).fill().map(() => Array(cols).fill(false));
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                if (mask[y][x]) {
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const ny = y + dy;
                            const nx = x + dx;
                            if (ny >= 0 && ny < rows && nx >= 0 && nx < cols) {
                                dilated[ny][nx] = true;
                            }
                        }
                    }
                }
            }
        }
        return dilated;
    }

    // ----- Main test function -----
    function regenerate() {
        const seed = parseInt(document.getElementById('seed').value);
        const numRivers = parseInt(document.getElementById('river_count').value);

        const thresholds = {
            ocean: parseFloat(document.getElementById('ocean_thresh').value),
            coast: parseFloat(document.getElementById('coast_thresh').value),
            plains: parseFloat(document.getElementById('plains_thresh').value),
            hills: parseFloat(document.getElementById('hills_thresh').value),
            mountains: parseFloat(document.getElementById('mountains_thresh').value)
        };

        const detailWidth = 800;
        const detailHeight = 800;

        // Generate high-res terrain (colors) and heightmap
        const highResTerrainGen = new TerrainGenerator(seed, detailWidth, detailHeight);
        const highResHeightmap = highResTerrainGen.generateHeightmap();
        let highResTerrain = highResTerrainGen.generateTerrain(highResHeightmap);

        // Generate river mask (using heightmap only)
        let riverMask = generateRivers(highResHeightmap, thresholds, numRivers, seed);
        console.log("DEBUG: rivers generated, count", riverMask.flat().filter(v => v).length);

        // Dilate rivers (make them thicker)
        riverMask = dilateMask(riverMask, 1);
        console.log("DEBUG: riverMask dilated");

        // Apply river colors to the terrain
        for (let y = 0; y < highResTerrain.length; y++) {
            for (let x = 0; x < highResTerrain[0].length; x++) {
                if (riverMask[y][x]) {
                    highResTerrain[y][x] = '#4a90e2';
                }
            }
        }

        // Render the terrain image
        const canvas = document.getElementById('test-canvas');
        canvas.width = detailWidth;
        canvas.height = detailHeight;
        highResTerrainGen.renderTerrain(highResTerrain, 'test-canvas');
        const ctx = canvas.getContext('2d');

        // --- Draw text labels at grid points ---
        const gridCols = 20;
        const gridRows = 20;
        const stepX = canvas.width / gridCols;
        const stepY = canvas.height / gridRows;

        ctx.save();
        ctx.fillStyle = 'black';
        ctx.font = 'bold 16px monospace';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 2;
        for (let row = 0; row < gridRows; row++) {
            for (let col = 0; col < gridCols; col++) {
                // Center of grid cell
                const x = col * stepX + stepX/2;
                const y = row * stepY + stepY/2;
                // Sample height at this pixel from the high-res heightmap
                const hx = Math.floor(x / canvas.width * highResHeightmap[0].length);
                const hy = Math.floor(y / canvas.height * highResHeightmap.length);
                const h = highResHeightmap[hy][hx];
                // Classify using current thresholds
                let terrain;
                if (h >= thresholds.mountains) terrain = 'snowcaps';
                else if (h >= thresholds.hills) terrain = 'mountains';
                else if (h >= thresholds.plains) terrain = 'hills';
                else if (h >= thresholds.coast) terrain = 'plains';
                else if (h >= thresholds.ocean) terrain = 'coast';
                else terrain = 'ocean';
                const terrainLetter = terrain.charAt(0);
                const heightVal = Math.round(h * 100);
                const isRiver = riverMask[hy][hx];
                let label = `${terrainLetter} ${heightVal}`;
                if (isRiver) label = `r ${label}`;
                ctx.fillStyle = 'white';
                ctx.fillText(label, x - 15, y + 5);
            }
        }
        ctx.restore();

        // Debug info
        const debugDiv = document.getElementById('debug-info');
        debugDiv.innerHTML = `Seed: ${seed}<br>
        Ocean < ${thresholds.ocean}<br>
        Coast: ${thresholds.ocean}–${thresholds.coast}<br>
        Plains: ${thresholds.coast}–${thresholds.plains}<br>
        Hills: ${thresholds.plains}–${thresholds.hills}<br>
        Mountains: ${thresholds.hills}–${thresholds.mountains}<br>
        Snowcaps: > ${thresholds.mountains}<br>
        First row heights: ${highResHeightmap[0].slice(0,10).map(h => h.toFixed(3)).join(', ')}<br>
        River cells: ${riverMask.flat().filter(v => v).length}`;
    }
