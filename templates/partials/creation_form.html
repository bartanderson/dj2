{% if not request.headers.get('HX-Request') %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Create Character</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div id="creation-form-container">
{% endif %}

<form id="character-form"
      action="/character-creation/submit"
      method="post"
      hx-post="/character-creation/submit"
      hx-target="#creation-form-container"
      hx-swap="outerHTML">

    <!-- Name -->
    <div>
        <label>Name:</label>
        <input type="text" name="name" value="{{ name }}"
               hx-post="/character-creation/update-form"
               hx-trigger="change"
               hx-include="#character-form"
               hx-target="#character-form"
               hx-swap="outerHTML">
    </div>

    <!-- Race -->
    <div>
        <label>Race:</label>
        <select name="race"
                hx-post="/character-creation/update-form"
                hx-trigger="change"
                hx-include="#character-form"
                hx-target="#character-form"
                hx-swap="outerHTML">
            <option value="">-- Choose Race --</option>
            {% for race_option in races %}
            <option value="{{ race_option }}" {% if race_option == race %}selected{% endif %}>{{ race_option }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Class -->
    <div>
        <label>Class:</label>
        <select name="class"
                hx-post="/character-creation/update-form"
                hx-trigger="change"
                hx-include="#character-form"
                hx-target="#character-form"
                hx-swap="outerHTML">
            <option value="">-- Choose Class --</option>
            {% for class_option in classes %}
            <option value="{{ class_option }}" {% if class_option == class %}selected{% endif %}>{{ class_option }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Background -->
    <div>
        <label>Background:</label>
        <select name="background"
                hx-post="/character-creation/update-form"
                hx-trigger="change"
                hx-include="#character-form"
                hx-target="#character-form"
                hx-swap="outerHTML">
            <option value="">-- Choose Background --</option>
            {% for bg in backgrounds %}
            <option value="{{ bg }}" {% if bg == background %}selected{% endif %}>{{ bg }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Skills (checkboxes) -->
    <div>
        <label>Skills:</label>
        {% for skill in skills_list %}
        <div>
            <input type="checkbox" name="skills" value="{{ skill }}"
                   {% if skill in selected_skills %}checked{% endif %}
                   hx-post="/character-creation/update-form"
                   hx-trigger="change"
                   hx-include="#character-form"
                   hx-target="#character-form"
                   hx-swap="outerHTML">
            <label>{{ skill }}</label>
        </div>
        {% endfor %}
    </div>

    <!-- Ability Scores -->
    <div>
        <label>Ability Scores (3-18 each):</label>
        {% for ability in ability_names %}
        <div>
            <label>{{ ability_display[loop.index0] }}:</label>
            <input type="number" name="{{ ability }}"
                   value="{{ ability_scores.get(ability, 10) }}"
                   min="3" max="18"
                   hx-post="/character-creation/update-form"
                   hx-trigger="change"
                   hx-include="#character-form"
                   hx-target="#character-form"
                   hx-swap="outerHTML">
        </div>
        {% endfor %}
    </div>

    <!-- Random All Button -->
    <button type="button"
            hx-post="/character-creation/random-all"
            hx-target="#character-form"
            hx-swap="outerHTML">Random All</button>

    <!-- Submit Button -->
    <button type="submit">Create Character</button>
</form>

{% if not request.headers.get('HX-Request') %}
</div>
</body>
</html>
{% endif %}
