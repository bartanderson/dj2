<!DOCTYPE html>
<html>
<head>
    <title>Terrain Map Generator</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; }
        canvas { border: 1px solid #888; margin: 20px; }
        .controls { margin: 10px; }
        input, button { padding: 5px; margin: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/seedrandom.min.js"></script>
</head>
<body>
    <div class="controls">
        Seed: <input type="text" id="seed" value="42">
        <button id="generate">Generate</button>
        <button id="randomSeed">Random Seed</button>
    </div>
    <canvas id="mapCanvas" width="800" height="600"></canvas>
    <div id="info"></div>

<script>
// ============================================================================
// Perlin Noise (replica of JS version)
// ============================================================================
class PerlinNoise {
    constructor(seed) {
        this.p = new Array(512);
        const perm = this.generatePermutation(seed);
        for (let i = 0; i < 512; i++) {
            this.p[i] = perm[i % 256];
        }
    }
    generatePermutation(seed) {
        const rng = new Math.seedrandom(seed.toString());
        const p = new Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i >= 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [p[i], p[j]] = [p[j], p[i]];
        }
        return p;
    }
    noise(x, y, z) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const Z = Math.floor(z) & 255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        z -= Math.floor(z);
        const u = this.fade(x);
        const v = this.fade(y);
        const w = this.fade(z);
        const A = (this.p[X] + Y) & 255;
        const AA = (this.p[A] + Z) & 255;
        const AB = (this.p[A + 1] + Z) & 255;
        const B = (this.p[X + 1] + Y) & 255;
        const BA = (this.p[B] + Z) & 255;
        const BB = (this.p[B + 1] + Z) & 255;
        return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z)), this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))), this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1)), this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
    }
    fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    lerp(t, a, b) { return a + t * (b - a); }
    grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
    }
}

// ============================================================================
// Terrain Generator (original logic from world.js / terrain-generator.js)
// ============================================================================
class TerrainGenerator {
    constructor(seed, width, height) {
        this.seed = seed;
        this.width = width;
        this.height = height;
        this.rng = new Math.seedrandom(seed.toString());
        this.perlin = new PerlinNoise(seed);
        this.moisturePerlin = new PerlinNoise(seed + 1000);
        // Terrain thresholds (from world.js)
        this.thresholds = {
            low: 0.3,
            plains: 0.54,
            forest: 0.65,
            hills: 0.73,
            mountains: 0.85
        };
        this.forestMinMoisture = 0.6;
        this.lakeHeight = 0.3;
        this.riverParams = {
            targetCountPer10000Cells: 1.25,
            maxSteps: 300,
            hillThreshold: 0.58,
            mountainThreshold: 0.65
        };
    }

    generateHeightmap() {
        const width = this.width;
        const height = this.height;
        const scale = 0.005;
        const octaves = 4;
        const persistence = 0.5;
        const lacunarity = 2.0;
        let maxNoise = 0;
        let amp = 1;
        for (let i = 0; i < octaves; i++) {
            maxNoise += amp;
            amp *= persistence;
        }
        const heightmap = Array(height).fill().map(() => Array(width).fill(0));
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let noise = 0;
                let a = 1;
                let f = 1;
                for (let i = 0; i < octaves; i++) {
                    noise += this.perlin.noise(x * scale * f, y * scale * f, this.seed) * a;
                    a *= persistence;
                    f *= lacunarity;
                }
                heightmap[y][x] = (noise + maxNoise) / (2 * maxNoise);
            }
        }
        return heightmap;
    }

    generateMoistureMap() {
        const width = this.width;
        const height = this.height;
        const scale = 0.005;
        const octaves = 4;
        const persistence = 0.5;
        const lacunarity = 2.0;
        let maxNoise = 0;
        let amp = 1;
        for (let i = 0; i < octaves; i++) {
            maxNoise += amp;
            amp *= persistence;
        }
        const moisture = Array(height).fill().map(() => Array(width).fill(0));
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let noise = 0;
                let a = 1;
                let f = 1;
                for (let i = 0; i < octaves; i++) {
                    noise += this.moisturePerlin.noise(x * scale * f, y * scale * f, this.seed + 1000) * a;
                    a *= persistence;
                    f *= lacunarity;
                }
                moisture[y][x] = (noise + maxNoise) / (2 * maxNoise);
            }
        }
        return moisture;
    }

    generateRivers(heightmap) {
        const width = this.width;
        const height = this.height;
        const area = width * height;
        const targetCount = Math.floor(area / 8000 * this.riverParams.targetCountPer10000Cells * 10000);
        const riverMask = Array(height).fill().map(() => Array(width).fill(false));
        const rng = new Math.seedrandom(this.seed + 10000);
        // Find start candidates (local maxima in hills/mountains)
        const candidates = [];
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const h = heightmap[y][x];
                if (h >= this.riverParams.hillThreshold && h <= this.riverParams.mountainThreshold) {
                    let isMax = true;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            if (dx === 0 && dy === 0) continue;
                            const nx = x + dx, ny = y + dy;
                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                if (heightmap[ny][nx] > h) {
                                    isMax = false;
                                    break;
                                }
                            }
                        }
                        if (!isMax) break;
                    }
                    if (isMax) candidates.push([x, y]);
                }
            }
        }
        // Shuffle
        for (let i = candidates.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        const maxSteps = this.riverParams.maxSteps;
        for (let r = 0; r < Math.min(targetCount, candidates.length); r++) {
            let [x, y] = candidates[r];
            const visited = new Set();
            const path = [];
            let steps = 0;
            while (true) {
                if (x < 0 || x >= width || y < 0 || y >= height) break;
                const key = `${x},${y}`;
                if (visited.has(key)) break;
                visited.add(key);
                path.push([x, y]);
                const h = heightmap[y][x];
                if (h < this.lakeHeight) break;
                // find lower neighbor
                let neighbors = [];
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height && !visited.has(`${nx},${ny}`)) {
                            const nh = heightmap[ny][nx];
                            if (nh < h) {
                                neighbors.push({ x: nx, y: ny, height: nh });
                            }
                        }
                    }
                }
                if (neighbors.length === 0) break;
                // weighted random
                let total = 0;
                const weights = neighbors.map(n => (h - n.height) + 0.1);
                weights.forEach(w => total += w);
                let rand = rng() * total;
                let chosen = null;
                for (let i = 0; i < neighbors.length; i++) {
                    if (rand < weights[i]) {
                        chosen = neighbors[i];
                        break;
                    }
                    rand -= weights[i];
                }
                if (!chosen) chosen = neighbors[0];
                x = chosen.x;
                y = chosen.y;
                steps++;
                if (steps > maxSteps) break;
            }
            for (let [px, py] of path) {
                riverMask[py][px] = true;
            }
        }
        return riverMask;
    }

    renderTerrainImage(heightmap, moistureMap, riverMask) {
        const width = this.width;
        const height = this.height;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data;

        const colorMap = {
            ocean:    [77, 111, 184],
            coast:    [162, 196, 201],
            plains:   [104, 159, 56],
            forest:   [44, 94, 46],
            hills:    [141, 153, 70],
            mountains:[141, 153, 174],
            snowcaps: [255, 255, 255],
            river:    [74, 144, 226],
            lake:     [58, 128, 194]
        };

        const lakeHeight = this.lakeHeight;
        const forestMinMoisture = this.forestMinMoisture;
        const thresholds = this.thresholds;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const h = heightmap[y][x];
                const m = moistureMap[y][x];
                let terrain;
                if (h < 0.45) terrain = 'ocean';
                else if (h < 0.5) terrain = 'coast';
                else if (h < 0.58) terrain = 'plains';
                else if (h < 0.65) terrain = 'hills';
                else if (h < 0.73) terrain = 'mountains';
                else terrain = 'snowcaps';
                if (h >= thresholds.plains && h < thresholds.forest && m > forestMinMoisture) terrain = 'forest';
                if (h < lakeHeight) terrain = 'lake';
                const rgb = colorMap[terrain];
                const idx = (y * width + x) * 4;
                data[idx] = rgb[0];
                data[idx+1] = rgb[1];
                data[idx+2] = rgb[2];
                data[idx+3] = 255;
            }
        }
        // Draw rivers
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                if (riverMask[y][x]) {
                    const idx = (y * width + x) * 4;
                    data[idx] = colorMap.river[0];
                    data[idx+1] = colorMap.river[1];
                    data[idx+2] = colorMap.river[2];
                }
            }
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }
}

// ============================================================================
// Main
// ============================================================================
function generateMap(seed) {
    const width = 3000;   // small for demo, but can be larger
    const height = 2400;
    const gen = new TerrainGenerator(seed, width, height);
    const heightmap = gen.generateHeightmap();
    const moisture = gen.generateMoistureMap();
    const rivers = gen.generateRivers(heightmap);
    const canvas = gen.renderTerrainImage(heightmap, moisture, rivers);
    const displayCanvas = document.getElementById('mapCanvas');
    displayCanvas.width = width;
    displayCanvas.height = height;
    const ctx = displayCanvas.getContext('2d');
    ctx.drawImage(canvas, 0, 0);
    document.getElementById('info').innerHTML = `Seed: ${seed} | Size: ${width}x${height}`;
}

document.getElementById('generate').addEventListener('click', () => {
    const seed = document.getElementById('seed').value;
    generateMap(seed);
});
document.getElementById('randomSeed').addEventListener('click', () => {
    const seed = Math.floor(Math.random() * 1000000);
    document.getElementById('seed').value = seed;
    generateMap(seed);
});
// Initial generation
generateMap(42);
</script>
</body>
</html>
